<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Starrupture Map - Pin Manager</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="dark-mode">
    <div class="container">
        <header>
            <h1>Starrupture Map Pin Manager</h1>
            <p>Click on the map to add pins at specific coordinates (X, Y)</p>
        </header>

        <div class="content">
            <div class="map-section">
                <div class="map-container" id="mapContainer">
                    <img id="mapImage" src="{{ url_for('map_image') }}" alt="Starrupture Map">
                    <div id="pinsOverlay" class="pins-overlay"></div>
                </div>
            </div>

            
            <div class="sidebar">
                <div class="coordinates-display">
                    <span>Grid X: <span id="coordX">-</span></span>
                    <span>Grid Y: <span id="coordY">-</span></span>
                </div>
                <div class="panel">
                    <h2>Add Pin</h2>
                    <div class="form-group">
                        <label for="pinName">Pin Name:</label>
                        <input type="text" id="pinName" placeholder="Enter pin name" value="New Location">
                    </div>
                    <div class="form-group">
                        <label for="pinX">Grid X:</label>
                        <input type="number" id="pinX" value="0">
                    </div>
                    <div class="form-group">
                        <label for="pinY">Grid Y:</label>
                        <input type="number" id="pinY" value="0">
                    </div>
                    <button id="addPinBtn" class="btn btn-primary">Add Pin</button>
                </div>

                <div class="panel">
                    <h2>Pins List</h2>
                    <div id="pinsList" class="pins-list">
                        <div class="pin-item empty">No pins yet</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal for editing pins -->
    <div id="editModal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h2>Edit Site</h2>
            <div class="form-group">
                <label for="editPinName">Site Name:</label>
                <input type="text" id="editPinName">
            </div>
            <div class="form-group">
                <label for="editPinX">Grid X:</label>
                <input type="number" id="editPinX">
            </div>
            <div class="form-group">
                <label for="editPinY">Grid Y:</label>
                <input type="number" id="editPinY">
            </div>
            <div class="form-group">
                <label for="editTeleporter">Teleporter:</label>
                <input type="text" id="editTeleporter" placeholder="Teleporter name (optional)">
            </div>
            <div class="form-group">
                <label for="editDescription">Description:</label>
                <textarea id="editDescription" rows="3" placeholder="Site description (optional)"></textarea>
            </div>
            <div class="modal-buttons">
                <button id="savePinBtn" class="btn btn-primary">Save</button>
                <button id="deletePinBtn" class="btn btn-danger">Delete</button>
            </div>
        </div>
    </div>

    <!-- Modal for Resource Node -->
    <div id="resourceNodeModal" class="modal">
        <div class="modal-content">
            <span class="close" data-modal="resourceNodeModal">&times;</span>
            <h2 id="resourceNodeModalTitle">Add Resource Node</h2>
            <div class="form-group">
                <label for="resourceNodeId">Resource ID:</label>
                <input type="text" id="resourceNodeId" placeholder="Unique identifier">
            </div>
            <div class="form-group">
                <label for="resourceItem">Resource Item:</label>
                <select id="resourceItem">
                    {% for item in valid_raw_items %}
                    <option value="{{ item }}">{{ item }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="form-group">
                <label for="resourceRate">Rate (items/min):</label>
                <input type="number" id="resourceRate" min="1" value="60">
            </div>
            <div class="form-group">
                <label for="resourceVariant">Variant:</label>
                <select id="resourceVariant">
                    <option value="impure">Impure</option>
                    <option value="normal" selected>Normal</option>
                    <option value="pure">Pure</option>
                </select>
            </div>
            <div class="form-group">
                <label for="resourceCoreId">Core ID (optional):</label>
                <input type="text" id="resourceCoreId" placeholder="Leave empty if not assigned">
            </div>
            <div class="modal-buttons">
                <button id="saveResourceNodeBtn" class="btn btn-primary">Save</button>
                <button id="deleteResourceNodeBtn" class="btn btn-danger" style="display:none;">Delete</button>
            </div>
        </div>
    </div>

    <!-- Modal for Core -->
    <div id="coreModal" class="modal">
        <div class="modal-content">
            <span class="close" data-modal="coreModal">&times;</span>
            <h2 id="coreModalTitle">Add Core</h2>
            <div class="form-group">
                <label for="coreId">Core ID:</label>
                <input type="text" id="coreId" placeholder="Unique identifier">
            </div>
            <div class="form-group">
                <label for="coreLevel">Core Level:</label>
                <select id="coreLevel">
                    <option value="0" selected>0 (1000 heat)</option>
                    <option value="1">1 (2500 heat)</option>
                    <option value="2">2 (4000 heat)</option>
                    <option value="3">3 (6000 heat)</option>
                    <option value="4">4 (10000 heat)</option>
                </select>
            </div>
            <div class="modal-buttons">
                <button id="saveCoreBtn" class="btn btn-primary">Save</button>
                <button id="deleteCoreBtn" class="btn btn-danger" style="display:none;">Delete</button>
            </div>
        </div>
    </div>

    <!-- Modal for Factory -->
    <div id="factoryModal" class="modal">
        <div class="modal-content">
            <span class="close" data-modal="factoryModal">&times;</span>
            <h2 id="factoryModalTitle">Add Factory</h2>
            <div class="form-group">
                <label for="factoryId">Factory ID:</label>
                <input type="text" id="factoryId" placeholder="Unique identifier">
            </div>
            <div class="form-group">
                <label for="factoryPurpose">Purpose:</label>
                <textarea id="factoryPurpose" rows="3" placeholder="Description of factory purpose"></textarea>
            </div>
            <div class="form-group">
                <label for="factoryDefaultCore">Default Core:</label>
                <input type="text" id="factoryDefaultCore" placeholder="Core ID for this factory">
            </div>
            <div class="modal-buttons">
                <button id="saveFactoryBtn" class="btn btn-primary">Save</button>
                <button id="deleteFactoryBtn" class="btn btn-danger" style="display:none;">Delete</button>
            </div>
        </div>
    </div>

    <div id="receiverModal" class="modal">
        <div class="modal-content">
            <span class="close" data-modal="receiverModal">&times;</span>
            <h2 id="receiverModalTitle">Add Receiver</h2>
            <div class="form-group">
                <label for="receiverId">Receiver ID:</label>
                <input type="text" id="receiverId" placeholder="Unique identifier">
            </div>
            <div class="form-group">
                <label for="receiverSiteId">Source Site ID:</label>
                <input type="text" id="receiverSiteId" placeholder="Site ID with dispatcher">
            </div>
            <div class="form-group">
                <label for="receiverFactoryId">Source Factory ID:</label>
                <input type="text" id="receiverFactoryId" placeholder="Factory ID with dispatcher">
            </div>
            <div class="form-group">
                <label for="receiverDispatcherId">Dispatcher ID:</label>
                <input type="text" id="receiverDispatcherId" placeholder="Dispatcher sending items">
            </div>
            <div class="form-group">
                <label for="receiverBuildingId">Building ID (optional):</label>
                <select id="receiverBuildingId">
                    <option value=""></option>
                    {% for building in receiving_buildings %}
                    <option value="{{ building }}">{{ building }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="modal-buttons">
                <button id="saveReceiverBtn" class="btn btn-primary">Save</button>
                <button id="deleteReceiverBtn" class="btn btn-danger" style="display:none;">Delete</button>
            </div>
        </div>
    </div>

    <div id="dispatcherModal" class="modal">
        <div class="modal-content">
            <span class="close" data-modal="dispatcherModal">&times;</span>
            <h2 id="dispatcherModalTitle">Add Dispatcher</h2>
            <div class="form-group">
                <label for="dispatcherId">Dispatcher ID:</label>
                <input type="text" id="dispatcherId" placeholder="Unique identifier">
            </div>
            <div class="form-group">
                <label for="dispatchedItem">Dispatched Item:</label>
                <select id="dispatchedItem">
                    <option value="">Select item</option>
                    {% for item in valid_items %}
                    <option value="{{ item }}">{{ item }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="form-group">
                <label for="dispatcherOutputRate">Output Rate Limit (items/min):</label>
                <input type="number" id="dispatcherOutputRate" min="1" value="100">
            </div>
            <div class="form-group">
                <label for="dispatcherInputRate">Input Rate Limit (items/min):</label>
                <input type="number" id="dispatcherInputRate" min="1" value="100">
            </div>
            <div class="form-group">
                <label for="dispatcherFromIds">Source IDs (comma-separated):</label>
                <textarea id="dispatcherFromIds" rows="2" placeholder="Machine, resource, or receiver IDs"></textarea>
            </div>
            <div class="form-group">
                <label for="dispatcherBuildingId">Building ID (optional):</label>
                <select id="dispatcherBuildingId">
                    <option value=""></option>
                    {% for building in dispatcher_buildings %}
                    <option value="{{ building }}">{{ building }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="modal-buttons">
                <button id="saveDispatcherBtn" class="btn btn-primary">Save</button>
                <button id="deleteDispatcherBtn" class="btn btn-danger" style="display:none;">Delete</button>
            </div>
        </div>
    </div>

    <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
