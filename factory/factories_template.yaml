# * A site defines a location within the world map.
# * The world map is a grid of X,Y co-ordinates.
# * The X co-ordinates have a range from -5 to +33.
# * The Y co-ordinates have a range from -13 to +32.
# * Fractional co-ordinates are not valid, only whole integer numbers are valid co-ordinate values.
# * The 0,0 co-ordinate is the location of the starting point in the game.
#   The game is in early-access and is still in development. The developers have said that the game
#   map will be expanded. Because the map is expected to be expanded, the origin 0,0 point was
#   chosen for the known fixed location in the world map that is not expected to change.
# * A site may contain multiple cores as the core protection size may be too small to encapsualate
#   all the resource nodes within a site. The core heat limit may not allow for a factory size
#   large enough to produce a complex item and thus the factory may have to be spread over multiple
#   cores, or the site may have multiple factories that produce parts of the bigger chain, where
#   each factory is within a different core. The design of the associations between site, core and
#   factory are to enable representation of any user (player) production chain layouts.
# * A factory has a purpose. This purpose is the reason the factory was created by the user.
# * A factory consists of machines. Each machine has inputs and outputs.
# * Factories can be linked to take in items from other factories or to supply items to another
#   factory.
# * A factory identifier is unique within a site. I intentionally didn't make factory name
#   globally unique, even though that is my preference, to not put artificial limits on the user.
# * All buildings within a factory must have a unique identifier,
# * Factories are not necessarily optimal. They will have items produced that are not used.
#   They will have insufficient inputs to produce all outputs. This will reduce the production rate.
#
# The reason some optional keys are written to the file with a default value is that the file is
# intended to be edited by the user outside of an application and having some keys present
# is to assist the user. The original intention was for this file to be created manually by the
# user (player) but later an application was visualised as a means to help the process.
#
# Storage capacity is defined in terms of items. So storage v.1 is defined to be able to store 400
# items. However, the presentation of the building is that storage v.1 has 4 stacks. For most
# items which have a limit of 100 items per stack, 4 stacks means 400 items. However, there are
# items that have larger limits such as building materials which are limited to 1000 items per
# stack. In that case, storage v.1 can store 4000 items (4x1000) which is more than the stated
# 400 items thus I believe that every storage building has a specific number of stacks which can
# store only one type of item per stack. I believe that a stack in the game is always of only one
# item type. There are two storage buildings I have yet to unlock, the multistorage and expandable
# storage. Building multistorage is able to store any item type and the player cannot select which
# types. Building expandable storage starts with 1600 units (16 stacks) but can be expanded up to
# 3200 units at additional power usage cost.
#
# I can only guess about certain rules as I have not unlocked all the buildings in the game. Once
# I have done so, I can confirm.
#

sites:

  # The site ID is a name provided by the user. The site ID must be globally unique.
  <site id>:

    # Optional. Populated by the user when the site is near a teleporter. When the user has not
    # filled in the teleporter name, this entry is written to the file with an empty string value.
    teleporter: ""

    # Required. Location of the site in the world map.
    # The first array element is the X co-ordinate.
    # The second array element is the Y co-ordinate.
    location: [0,0]

    # Optional description for the site. When the user has not provided a description, the entry
    # is written to the file with an empty string value.
    description: ""

    # Optional list of resource nodes available within the site. Each resource node is identified
    # by the resource ID. The reason resource nodes are defined separate from the factories
    # is two fold:
    # 1. Allows the user to define the resources of the site before a factory is created.
    # 2. Allows for multiple factories to share a single resource node.
    resource_nodes:

      # Resource IDs must be unique within the site and may not conflict with any machine ID across
      # all factories of the site. These resources are not available outside the site so the ID
      # does not need to be globally unique but the resource is treated as a special machine that
      # is shared across all factories. The ID is a name provided by the user.
      <resource id>:

        # Required: Name of item supplied by the resource. The item is selected by the user.
        # Current valid items are:
        #   "calcium ore", "helium-3", "sulfur ore", "titanium ore", "wolfram ore"
        # This list may change as the game develops so the valid list should be provided by the web
        # server. May not be an empty string, must always be one of the valid items.
        resource_item: "selected valid resource name"

        # Required. The combination of resource_item and variant determine the rate of supply in
        # items per minute. Values are: "impure", "normal", "pure". This is selected by the user.
        variant: "variant name"

        # Value is optional until specified as an input to a factory machine, then required. This
        # specifies the core that the actual extractor machine belongs to. When populated,
        # the value must be a valid core_id defined in the cores list of this site. When not
        # specified, this entry is written to the file with an empty string.
        core_id: "valid core id or an empty string"

    # Cores are optional for a site when no factories are defined but required before a factory
    # can be added. A core is a game mechanism that restricts that size of a factory through the
    # constraints of heat limit and danger level. You cannot create a factory that exceeds the
    # heat limit without severe consequences for production as the factory won't automatically
    # cool after a rupture and requires that the player manually cool each building. In order to
    # increase the heat limit, the core level must be increased but this also increases the danger
    # level. When the core level is incremented from zero, hostile creatures will raid the factory
    # at intervals and if they overwhelm the base defences, the factory buildings will be
    # destroyed. The higher the core level, the stronger the raid.
    cores:

      # Core IDs must be unique within the site. The cores are specific to the site so the IDs don't
      # need to be globally unique. The core ID is a name provide by the user.
      <core id>:

        # Required. The core cooling level that is also the danger level. Default value is zero.
        # Valid values are: 0, 1, 2, 3, 4.
        # Core level to heat limit mapping:
        #  0: 1000
        #  1: 2500
        #  2: 4000
        #  3: 6000
        #  4: 10000
        core_level: 0

        # Optional. The current heat of the core is calculated as the sum of heat from all
        # buildings that are associated with the core. However, not all buildings are part of the
        # manufacturing chain so those buildings need to be listed for the heat calculation.
        non_production_buildings:
          # A list of buildings that do not contribute to the production chain. The building name
          # must be from a valid list of buildings supplied from the web server. This is a list so
          # that the building names are not required to be unique. The number is the building count.
          # The building name is chosen from a list of valid names supplied by the web server.
          # Example valid names include "base core amplifier v.1", "defense turret", "habitat",
          # "large habitat".
          # The value is the user provided count of the building within the site.
          # Only positive integer numbers are allowed. The user may enter the number directly, or
          # use the +, - buttons to increment or decrement the value. The default value when adding
          # a building to the list is 1.
          # The application must have a button that will consolidate all the buildings within the
          # list, by name, with value as the sum of all corresponding counts. The purpose for
          # allowing multiple building entries is in how I expect the user will go around the map
          # and add buildings to the core as found.
          - <building name>: 1

    # Optional. A factory is a production chain with a purpose. It is optional to allow the user
    # to add sites before filling with factories. For example, the user may want to add sites
    # near resource nodes while they are exploring the map in order to note the locations of those
    # resources.
    factories:

      # Factory IDs must be unique within the site. The factory ID is a name provided by the user
      # when creating the factory.
      <factory id>:

        # Optional description of the factory purpose. When not entered by the user, must be
        # written to the file as an empty string.
        purpose: ""

        # All factory buildings must be associated with a core but it is possible for a factory
        # to span multiple cores so some factory buildings associated with a core while other
        # buildings associated with a different core. The default core is the value used when
        # a factory building doesn't have a core specified. The value must be a valid core_id
        # defined within the cores list of this site.
        default_core: "core id"

        # Optional list of machines that either craft or store items within the production chain.
        # When no machines are defined, this entry is omitted from the file.
        machines:

          # Optional list of machines that craft items from other items.
          crafters:

            # The machine ID that identifies the crafting machine. Within the factory, cannot be
            # the same as any other crafter machine id, storage machine id, receiver id, or dispatcher
            # id. Also cannot be the same as a resource id of the site since those are treated as
            # machines shared across factories.
            # The machine ID is a name provided by the user when creating the machine.
            # No building is defined for the crafting machine as the crafted item can only be
            # made in a specific building so the building details are inferred from the crafted
            # item.
            <machine id>:

              # Required. The item that is crafted by this machine. The list of valid items is
              # provided by the web server. The user will select from a sorted list of valid items.
              crafted_item: "valid item name"

              # Required. There will be one entry in the array for each of the items required
              # to craft the craftable. The required items are specified by the crafted item
              # recipe. The recipe is provided by the web server.
              inputs:
                - # Must correspond with one of the recipe items used to craft "item". The
                  # "input_item" may only appear once in the "inputs" list. The user will select
                  # from a sorted list of valid items that are defined for the crafting recipe.
                  # The recipe is provided by the web server. The list shown to the user will
                  # exclude items already added to inputes.
                  input_item: "item name from valid list of items"

                  # Inputs can be merged from multiple sources into one connection.
                  # All the inputs listed here must supply the item specified by
                  # "input_item". The list value must be a valid machine ID defined by this
                  # factory, a valid resource ID defined in the resource_nodes list of this site,
                  # or a receiver id defined in the receivers list of this factory.
                  from_ids:
                    - "machine, resource, or receiver id"

                  # The maximum rate at which items can be transferred along this connection.
                  # Essentially represents the speed of the rail connected to the input port.
                  # Must be a positive integer greater than zero.
                  rate_limit_ipm: 1

              # Optional link to a core defined for the same site that the machine is part of.
              # When not present, this machine is associated with the core specified in the factor
              # default_core value. When present, the value must be a valid core_id defined in the
              # cores list of this site.
              core_id: "core id"


          # Optional list of machines that can be used as simple storage bins, when
          # only receiving items, or buffers, when connected to the input of another
          # machine.
          storage:

            # The machine ID that identifies the storage. Within the factory, cannot be
            # the same as any other crafter machine id, storage machine id, receiver id, or dispatcher
            # id. Also cannot be the same as a resource id of the site since those are treated as
            # machines shared across factories.
            # The machine ID is a name provided by the user when creating the machine.
            <machine id>:

              # Required. Link to a valid storage building. The list of valid storage buildings is
              # provided by the web server. The user will select from a sorted list of valid storage
              # buildings.
              building_id: "valid storage building name"

              # Required. Some storage buildings are limited to storing only one item type. In that
              # case, the item is specified here. Some storage buildings allow any item to be
              # stored. In that case, the value must be "*".
              # Only valid items provided by the web server are allowed.
              # When specifying the stored item, the user will select it from a sorted list of valid
              # items.
              stored_item: "valid item name or * for any"

              # Optional. Number of storage stacks available when the storage building defines a
              # variable number of stacks. When the storage defines a fixed number of stacks, this
              # entry must be omitted. Must be an integer number equal or greater than the specified
              # starting number of stacks for the building.
              num_stacks: 1

              # Required. There will be one entry in the array for each of the items listed in
              # stored_items.
              inputs:
                - # Required. Inputs can be merged from multiple sources into one connection.
                  # When "stored_item" is not "*", all the inputs listed here must supply the item.
                  # The list value must be a valid machine ID defined by this
                  # factory, a valid resource ID defined in the resource_nodes list of this site,
                  # or a receiver id defined in the receivers list of this factory.
                  from_ids:
                    - "machine, resource, or receiver id"

                  # Required. The maximum rate at which items can be transferred along this
                  # connection. Essentially represents the speed of the rail connected to the
                  # input port.
                  # Must be a positive integer greater than zero.
                  rate_limit_ipm: 1


        # Optional and only required when a source of items is dispatched from another factory.
        # Multiple dispatchers can link to a single receiver for a M:1 relationship. I originally
        # designed this with a 1:1 relationship when I intended these as only virtual ports but
        # since then I have changed my mind and now want the dispatcher and receiver to directly
        # model the mechanisms in the game.
        receivers:

          # Identifies the receiver. Within the factory, cannot be the same as any other crafter
          # machine id, storage machine id, receiver id, or dispatcher id. Also cannot be the same
          # as a resource id of the site since those are treated as machines shared across
          # factories.
          <receiver id>:

            # List of dispatchers that send items to this receiver. When a dispatcher is linked to
            # this receiver, the receiver identity must be set in the dispatcher as well. This
            # is for validation and as an easy mechanism to show that a dispatcher is already
            # linked.
            dispatchers:
              - # Rates and items are determined from the corresponding dispatcher.
                # The dispatcher must be from another factory.

                # Required. The site of the dispatcher.
                site_id: ""
                # Required. The factory of the dispatcher.
                factory_id: ""
                # Required. The dispatcher. Since the dispatcher_id is unique only with a factory of a
                # site, all three IDs are required.
                dispatcher_id: ""

            # Optional name of the building that facilitates the input of items into the factory.
            # This is optional as ingress can be facilitated by rails which are not counted as
            # buildings. In the case that rails are the mechanism, this entry is omitted. If the
            # mechanims is a building, then the entry must be present and the value must be the
            # name of a receiver type building.
            building_id: "building name"


        # Optional and only required when this factory is the source of items being dispatched to
        # another factory. A dispatcher may only connect to one receiver.
        dispatchers:

          # Identifies the dispatcher. Within the factory, cannot be
          # the same as any other crafter machine id, storage machine id, receiver id, or dispatcher
          # id. Also cannot be the same as a resource id of the site since those are treated as
          # machines shared across factories.
          <dispatcher id>:

            # Item that is dispatched. This was added to the spec for validation purposes as well
            # as allowing for the user to see the intention when viewing the file.
            # The list of valid items is provided by the web server. The user will select from a
            # sorted list of valid items.
            dipatched_item: "valid item name"

            # The maximum rate that items can be transferred out of the factory over this
            # connection. If the mechanims is rails, then this will be the rails maximum transfer
            # rate.
            #
            # For cargo dispatchers, it depends on the input rails into the building and can be
            # calculated as such:
            # rails ipm | receive 100 | +10s  | Num batches | Max sent ipm | ipm |
            # v.1   120 |         50s |   60s |       1.000 |      100.000 | 100 |
            # v.2   240 |         25s |   35s |       1.714 |      171.429 | 171 |
            # v.3   480 |       12.5s | 22.5s |       2.667 |      266.667 | 266 |
            #
            # Must be a positive integer greater than zero.
            output_rate_limit_ipm: 1

            # Inputs can be merged from multiple sources into one connection.
            # All the inputs listed here must supply the item specified by
            # "dipatched_item". The list value must be a valid machine ID defined by this
            # factory, or a valid resource ID defined in the resource_nodes list of this site.
            from_ids:
              - "machine, resource id"

            # The maximum rate at which items can be received into this dispatcher from the inputs
            # specified by from_ids.
            # Essentially represents the speed of the rail connected to the input port.
            # Must be a positive integer greater than zero.
            input_rate_limit_ipm: 0

            # Optional name of the building that facilitates the output of items from the factory.
            # This is optional as egress can be facilitated by rails which are not counted as
            # buildings. In the case that rails are the mechanism, this entry is omitted. If the
            # mechanims is a building, then the entry must be present and the value must be the
            # name of a dispatcher type building.
            building_id: "building name"

            # Required. Link to a receiver. When a receiver has not been linked, the values will
            # be empty strings. When this dispatcher is linked to a receiver, the receiver identity
            # must be set here. This is for validation and as an easy mechanism to show that the
            # dispatcher is already linked.
            receiver:
              # Required. The site of the receiver.
              site_id: ""
              # Required. The factory of the receiver.
              factory_id: ""
              # Required. The receiver.
              receiver_id: ""


        # Optional. The calculation for production chain node production rates is based on a pull
        # mechanism such that a request for items is made to a supplier and the supplier will
        # approve a certain rate provision based on capacity. This mechanism requires a starting
        # point, some goal to be met and the targets specified here provide that starting point.
        targets:
          # Identifies the target specifier. Within the factory, cannot be
          # the same as any other crafter machine id, storage machine id, receiver id, or dispatcher
          # id. Also cannot be the same as a resource id of the site since those are treated as
          # machines shared across factories.
          <target_id>:

            # The required rate that the combination of all suppliers must attempt to satisfy.
            target_rate_ipm: 1

            # The list of suppliers that must meet the target. The id must be from either a
            # dispatcher, machine or resource within the factory.
            from_ids:
              - "dispatcher, machine, resource id"

